<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
<title id="title">About Dhruv Sahu</title><desc id="desc">Capabilities and interests.</desc>
<defs>
  <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
    <stop offset="0" stop-color="#070b16"/><stop offset="1" stop-color="#0c1427"/>
  </linearGradient>
  <linearGradient id="line" x1="0" x2="1">
    <stop offset="0" stop-color="#247bff"/><stop offset="1" stop-color="#ff354f"/>
  </linearGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="10" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <style>
    .bg{fill:url(#bg)} .t{fill:#f5f7fb;font-family:Arial,Helvetica,sans-serif}
    .muted{fill:#9ca8bd;font-family:Arial,Helvetica,sans-serif}
    .blue{fill:#247bff} .red{fill:#ff354f}
    .line{stroke:url(#line);stroke-width:1.5;fill:none}
    .card{fill:#0d1527;stroke:#26334d;stroke-width:1}
    @media (prefers-reduced-motion: reduce) { * { animation:none!important; } }
  </style>
</defs>

<rect width="1200" height="520" rx="28" class="bg"/>
<text x="70" y="75" class="muted" font-size="18">01 / ABOUT</text>
<text x="70" y="125" class="t" font-size="44" font-weight="800">Building. Learning. Shipping.</text>
<text x="70" y="165" class="muted" font-size="19">A CSE student focused on software development, AI and modern web technology.</text>
<rect x="70" y="210" width="520" height="220" rx="22" class="card"/>
<text x="100" y="250" class="t" font-size="22" font-weight="700">Capabilities</text>
<text x="100" y="290" class="muted" font-size="18">• Full-stack web development</text>
<text x="100" y="325" class="muted" font-size="18">• Java &amp; Spring Boot development</text>
<text x="100" y="360" class="muted" font-size="18">• Python / Flask applications</text>
<text x="100" y="395" class="muted" font-size="18">• AI-powered product ideas</text>
<rect x="640" y="210" width="490" height="220" rx="22" class="card"/>
<text x="670" y="250" class="t" font-size="22" font-weight="700">Interests</text>
<text x="670" y="310" class="t" font-size="34">Software Development</text>
<text x="670" y="355" class="t" font-size="34">AI &amp; Web Technology</text>
<text x="670" y="400" class="t" font-size="34">Cinematography</text>
<g opacity=".9">
 <rect x="670" y="445" width="410" height="4" rx="2" fill="#26334d"/>
 <rect x="670" y="445" width="136" height="4" rx="2" fill="#247bff">
  <animate attributeName="x" values="670;944;670" dur="12s" repeatCount="indefinite"/>
 </rect>
</g>
</svg>

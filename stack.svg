<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
<title id="title">Dhruv Sahu — Tech Stack</title><desc id="desc">Core technologies used across development projects.</desc>
<defs>
  <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
    <stop offset="0" stop-color="#070b16"/><stop offset="1" stop-color="#0c1427"/>
  </linearGradient>
  <linearGradient id="line" x1="0" x2="1">
    <stop offset="0" stop-color="#247bff"/><stop offset="1" stop-color="#ff354f"/>
  </linearGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="10" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <style>
    .bg{fill:url(#bg)} .t{fill:#f5f7fb;font-family:Arial,Helvetica,sans-serif}
    .muted{fill:#9ca8bd;font-family:Arial,Helvetica,sans-serif}
    .blue{fill:#247bff} .red{fill:#ff354f}
    .line{stroke:url(#line);stroke-width:1.5;fill:none}
    .card{fill:#0d1527;stroke:#26334d;stroke-width:1}
    @media (prefers-reduced-motion: reduce) { * { animation:none!important; } }
  </style>
</defs>

<rect width="1200" height="520" rx="28" class="bg"/>
<text x="70" y="75" class="muted" font-size="18">02 / STACK</text>
<text x="70" y="125" class="t" font-size="44" font-weight="800">Tools I build with.</text>
<ellipse cx="820" cy="300" rx="330" ry="115" fill="none" stroke="#247bff" stroke-width="2" opacity=".35" transform="rotate(-12 820 300)"/>
<ellipse cx="820" cy="300" rx="270" ry="85" fill="none" stroke="#ff354f" stroke-width="2" opacity=".3" transform="rotate(28 820 300)"/>
<circle cx="820" cy="300" r="74" fill="#111c32" stroke="#26334d"/>
<text x="820" y="292" text-anchor="middle" class="t" font-size="24" font-weight="800">DHRUV</text>
<text x="820" y="320" text-anchor="middle" class="muted" font-size="16">BUILD STACK</text>
<g class="t" font-size="18" font-weight="700">
<text x="560" y="230">Java</text><text x="1010" y="245">Python</text>
<text x="575" y="385">Spring Boot</text><text x="985" y="380">JavaScript</text>
<text x="750" y="165">MySQL</text><text x="770" y="455">Flask</text>
</g>
<g>
 <rect x="70" y="190" width="350" height="52" rx="26" fill="#111c32" stroke="#26334d"/><text x="95" y="224" class="t" font-size="17">Java • Spring Boot • REST APIs</text>
 <rect x="70" y="260" width="350" height="52" rx="26" fill="#111c32" stroke="#26334d"/><text x="95" y="294" class="t" font-size="17">Python • Flask • AI integrations</text>
 <rect x="70" y="330" width="350" height="52" rx="26" fill="#111c32" stroke="#26334d"/><text x="95" y="364" class="t" font-size="17">HTML • CSS • JavaScript</text>
 <rect x="70" y="400" width="350" height="52" rx="26" fill="#111c32" stroke="#26334d"/><text x="95" y="434" class="t" font-size="17">MySQL • Git • GitHub</text>
</g>
</svg>

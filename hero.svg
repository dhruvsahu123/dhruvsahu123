<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
<title id="title">Dhruv Sahu — Full Stack Developer</title><desc id="desc">B.Tech CSE student and aspiring full stack developer from Kanpur.</desc>
<defs>
  <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
    <stop offset="0" stop-color="#070b16"/><stop offset="1" stop-color="#0c1427"/>
  </linearGradient>
  <linearGradient id="line" x1="0" x2="1">
    <stop offset="0" stop-color="#247bff"/><stop offset="1" stop-color="#ff354f"/>
  </linearGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="10" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <style>
    .bg{fill:url(#bg)} .t{fill:#f5f7fb;font-family:Arial,Helvetica,sans-serif}
    .muted{fill:#9ca8bd;font-family:Arial,Helvetica,sans-serif}
    .blue{fill:#247bff} .red{fill:#ff354f}
    .line{stroke:url(#line);stroke-width:1.5;fill:none}
    .card{fill:#0d1527;stroke:#26334d;stroke-width:1}
    @media (prefers-reduced-motion: reduce) { * { animation:none!important; } }
  </style>
</defs>

<rect width="1200" height="520" rx="28" class="bg"/>
<circle cx="1010" cy="90" r="140" fill="#247bff" opacity=".08" filter="url(#glow)"/>
<circle cx="1090" cy="420" r="170" fill="#ff354f" opacity=".05" filter="url(#glow)"/>
<path d="M40 470H1160" class="line" opacity=".45"/>
<text x="70" y="85" class="muted" font-size="22">HELLO, I'M</text>
<text x="68" y="155" class="t" font-size="64" font-weight="800">DHRUV SAHU</text>
<rect x="70" y="180" width="285" height="4" rx="2" fill="#247bff">
  <animate attributeName="width" from="0" to="285" dur="1s" fill="freeze"/>
</rect>
<text x="70" y="230" class="t" font-size="28">B.Tech CSE • Aspiring Full Stack Developer</text>
<text x="70" y="278" class="muted" font-size="20">Building practical full-stack and AI-powered solutions</text>
<text x="70" y="309" class="muted" font-size="20">with Java, Spring Boot, Python and JavaScript.</text>
<g>
  <rect x="70" y="350" width="420" height="52" rx="26" fill="#111c32" stroke="#26334d"/>
  <circle cx="98" cy="376" r="7" fill="#247bff"/>
  <text x="118" y="383" class="t" font-size="18">Kanpur, Uttar Pradesh, India</text>
</g>
<g>
  <rect x="70" y="420" width="330" height="45" rx="22" fill="#111c32" stroke="#26334d"/>
  <text x="92" y="449" class="muted" font-size="16">Java • Spring Boot • Python • JS</text>
</g>
<rect x="850" y="70" width="270" height="360" rx="24" fill="#111827" stroke="#26334d"/>
<image href="id.png" x="865" y="85" width="240" height="330" preserveAspectRatio="xMidYMid meet"/>
<text x="870" y="455" class="muted" font-size="13">Replace id.png with your transparent portrait</text>
</svg>

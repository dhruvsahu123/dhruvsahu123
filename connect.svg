<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
<title id="title">Connect with Dhruv Sahu</title><desc id="desc">Social links for Dhruv Sahu.</desc>
<defs>
  <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
    <stop offset="0" stop-color="#070b16"/><stop offset="1" stop-color="#0c1427"/>
  </linearGradient>
  <linearGradient id="line" x1="0" x2="1">
    <stop offset="0" stop-color="#247bff"/><stop offset="1" stop-color="#ff354f"/>
  </linearGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="10" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <style>
    .bg{fill:url(#bg)} .t{fill:#f5f7fb;font-family:Arial,Helvetica,sans-serif}
    .muted{fill:#9ca8bd;font-family:Arial,Helvetica,sans-serif}
    .blue{fill:#247bff} .red{fill:#ff354f}
    .line{stroke:url(#line);stroke-width:1.5;fill:none}
    .card{fill:#0d1527;stroke:#26334d;stroke-width:1}
    @media (prefers-reduced-motion: reduce) { * { animation:none!important; } }
  </style>
</defs>

<rect width="1200" height="520" rx="28" class="bg"/>
<text x="70" y="75" class="muted" font-size="18">04 / CONNECT</text>
<text x="70" y="125" class="t" font-size="44" font-weight="800">Let's build something useful.</text>
<rect x="55" y="160" width="470" height="300" rx="24" fill="#0d1527" stroke="#26334d"/>
<image href="right_pointing.png" x="70" y="170" width="440" height="280" preserveAspectRatio="xMidYMid meet"/>
<text x="70" y="480" class="muted" font-size="13">Replace right_pointing.png with your transparent character.</text>
<g>
 <rect x="600" y="175" width="470" height="70" rx="20" fill="#111c32" stroke="#26334d"/>
 <circle cx="635" cy="210" r="11" fill="#247bff"/><text x="665" y="217" class="t" font-size="21">github.com/dhruvsahu123</text>
 <rect x="600" y="265" width="470" height="70" rx="20" fill="#111c32" stroke="#26334d"/>
 <circle cx="635" cy="300" r="11" fill="#247bff"/><text x="665" y="307" class="t" font-size="21">LinkedIn / Dhruv Sahu</text>
 <rect x="600" y="355" width="470" height="70" rx="20" fill="#111c32" stroke="#26334d"/>
 <circle cx="635" cy="390" r="11" fill="#ff354f"/><text x="665" y="397" class="t" font-size="21">Instagram / @dhruv_photostudio</text>
</g>
</svg>
